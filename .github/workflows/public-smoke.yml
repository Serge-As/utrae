name: UTRAE public synthetic smoke
# Public-only CI. NEVER check out or fetch private URAE sources or artifacts.
# Run the tracked-file allowlist check on EVERY public change, including docs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Public scope allowlist and synthetic smoke
        run: npm test
